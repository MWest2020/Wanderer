# to build a richer sentence from, only the target's domain) and on
# the reasoning page for rules without a richer answer-sheet entry
# above. Every rule in DefaultRules() MUST have an entry here — run 05
# task 5.3, enforced by TestEveryRuleHasHandeling — even the seven
# rules already covered above, whose accountability-sheet remediation
# stays in place for that richer, evidence-parametrised context. One
# sentence, one parameter: {domein}.
