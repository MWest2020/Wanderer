run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofumpt
    - goimports
    - misspell
    - revive
    - gosec

linters-settings:
  misspell:
    # misspell kent alleen Engels. Een paar Nederlandse woorden in deze
    # code zijn geen typefouten maar de juiste term: "Stichting" is een
    # rechtsvorm (hij stelt "Stitching" voor) en "certificaat" staat in
    # de Nederlandse UI-teksten (hij stelt "certificate" voor).
    #
    # De linter blijft verder aan staan, want de rest van de code is
    # Engels en daar hoort hij typefouten te vinden. Groeit deze lijst
    # met gewone Nederlandse woorden, dan is dat een teken dat er
    # Nederlands in de code lekt waar het niet hoort — niet dat de
    # lijst langer moet.
    ignore-words:
      - stichting
      - certificaat

  gosec:
    excludes:
      - G304 # file-path from variable is fine for CLI flags

issues:
  exclude-rules:
    # TLS-inspection probe: it must connect to whatever a target
    # offers (including legacy TLS) to observe and report it — a high
    # MinVersion would defeat the probe; verification failures are
    # emitted as findings, not errors.
    - path: internal/probe/tls/tls\.go
      linters: [gosec]
      text: "G402"
    # The query WHERE clause is assembled from a fixed, caller-supplied
    # column-name allowlist with `?` placeholders; every value is bound
    # via args (see whereAndArgs). No user input reaches the SQL string.
    - path: internal/store/export\.go
      linters: [gosec]
      text: "G202"
    # Test fixtures write throwaway files into a t.TempDir(); their
    # mode is irrelevant to production security.
    - path: _test\.go
      linters: [gosec]
      text: "G306"
