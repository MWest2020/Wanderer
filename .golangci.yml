run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofumpt
    - goimports
    - misspell
    - revive
    - gosec

linters-settings:
  misspell:
    # misspell kent alleen Engels. Een paar Nederlandse woorden in deze
    # code zijn geen typefouten maar de juiste term: "Stichting" is een
    # rechtsvorm (hij stelt "Stitching" voor) en "certificaat" staat in
    # de Nederlandse UI-teksten (hij stelt "certificate" voor).
    #
    # De linter blijft verder aan staan, want de rest van de code is
    # Engels en daar hoort hij typefouten te vinden. Groeit deze lijst
    # met gewone Nederlandse woorden, dan is dat een teken dat er
    # Nederlands in de code lekt waar het niet hoort — niet dat de
    # lijst langer moet.
    ignore-words:
      - stichting
      - certificaat

  gosec:
    excludes:
      - G304 # file-path from variable is fine for CLI flags

issues:
  exclude-rules:
    # TLS-inspection probe: it must connect to whatever a target
    # offers (including legacy TLS) to observe and report it — a high
    # MinVersion would defeat the probe; verification failures are
    # emitted as findings, not errors.
    - path: internal/probe/tls/tls\.go
      linters: [gosec]
      text: "G402"
    # The query WHERE clause is assembled from a fixed, caller-supplied
    # column-name allowlist with `?` placeholders; every value is bound
    # via args (see whereAndArgs). No user input reaches the SQL string.
    - path: internal/store/export\.go
      linters: [gosec]
      text: "G202"
    # Test fixtures write throwaway files into a t.TempDir(); their
    # mode is irrelevant to production security.
    - path: _test\.go
      linters: [gosec]
      text: "G306"
    # int -> uint16 conversions in test helpers, where the value is a
    # literal or a loop index the test itself constructs — not
    # attacker-controlled input, so the overflow G115 warns about
    # cannot occur here.
    - path: _test\.go
      linters: [gosec]
      text: "G115"
    # linkifyVerdict maakt de internet.nl-rapport-URL aanklikbaar en
    # geeft daarom template.HTML terug — G203 vuurt op elke linkifier.
    # De URL komt uit een geïmporteerd bestand en is dus beïnvloedbaar,
    # dus dit is geen aanname: de functie eist schema http/https én een
    # host, en escapet zowel de href als de linktekst.
    #
    # Het bewijs staat eronder, niet in deze comment:
    # TestLinkifyVerdict_EscapesBreakoutAttempts dekt vier pogingen
    # (aanhalingsteken uit het href-attribuut, <script>, javascript:,
    # en een gesmokkelde <img>). Nagemeten 2026-09-22: haal de escaping
    # uit de href en drie van de vier subtests vallen om.
    - path: internal/ui/linkify\.go
      linters: [gosec]
      text: "G203"
    # scripts/action_report_test.go starts jq with a path built from
    # filepath.Join(".", "action-report.jq") — a fixed, test-local
    # path, not external input.
    - path: scripts/action_report_test\.go
      linters: [gosec]
      text: "G204"
