name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - run: go build ./...
      - run: go test -race -cover ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          # Build golangci-lint from source with the runner's Go 1.25
          # toolchain. The prebuilt "latest" binary is compiled with
          # Go 1.24 and refuses a module that targets go 1.25.0
          # ("build go version lower than targeted"). goinstall sidesteps
          # that while keeping the existing v1 .golangci.yml.
          version: v1.64.8
          install-mode: goinstall
